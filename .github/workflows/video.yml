name: Ambil video

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Link TikTok / Instagram Reels / YouTube Shorts"
        required: true

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Siapkan alat
        run: |
          pip install -q -U "yt-dlp[default,curl-cffi]"
          which ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)

      - name: Unduh video
        env:
          URL: ${{ inputs.url }}
          COOKIES: ${{ secrets.COOKIES }}
        run: |
          EXTRA=""
          if [ -n "$COOKIES" ]; then
            printf '%s\n' "$COOKIES" > cookies.txt
            EXTRA="--cookies cookies.txt"
          fi
          yt-dlp $EXTRA -S "res:720,ext:mp4" --merge-output-format mp4 \
            --write-info-json -o "video.%(ext)s" "$URL"
          F=$(ls video.* | grep -v '\.info\.json$' | head -1)
          AUDIO_ONLY=false
          if [ "$F" != "video.mp4" ]; then
            if ffprobe -v error -select_streams v -show_entries stream=index -of csv=p=0 "$F" | grep -q .; then
              ffmpeg -y -loglevel error -i "$F" -c:v libx264 -c:a aac video.mp4
            else
              # Audio only (e.g. TikTok photo slideshow): wrap audio in a black video
              AUDIO_ONLY=true
              ffmpeg -y -loglevel error -f lavfi -i color=c=black:s=320x320:r=1 -i "$F" \
                -shortest -c:v libx264 -tune stillimage -c:a aac video.mp4
            fi
          fi
          jq --argjson ao $AUDIO_ONLY \
            '{url: .webpage_url, title, uploader, upload_date, duration, description, view_count, like_count, audio_only: $ao}' \
            video.info.json > latest.json
          cat latest.json
          ls -lh video.mp4

      - name: Taruh di Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          N: ${{ github.run_number }}
        run: |
          gh release view videos --repo "$REPO" >/dev/null 2>&1 || \
            gh release create videos --repo "$REPO" --title "Videos" \
              --notes "Video yang diambil lewat workflow 'Ambil video'. latest.mp4 = video terbaru."
          cp video.mp4 latest.mp4
          cp video.mp4 "video-$N.mp4"
          cp latest.json "video-$N.json"
          gh release upload videos latest.mp4 latest.json "video-$N.mp4" "video-$N.json" \
            --repo "$REPO" --clobber
          echo "Selesai: video-$N.mp4"
